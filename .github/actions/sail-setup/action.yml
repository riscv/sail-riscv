name: "sail-riscv CI setup"
description: "Composite action to install packages, setup CMake, and install/build Sail"
inputs:
  cmake-version:
    description: "CMake version to install"
    required: false
    default: "4.1.2"
  sail-version:
    description: 'Sail version to install (use "latest" to build from source)'
    required: false
  # install-clang installs Clang on the runner but leaves the default compiler detected
  # by CMake unchanged. On Linux, this is usually GCC. It may be necessary to install
  # clang even for a GCC build of the model to compile the first-party tests.
  install-clang:
    description: "Install Clang"
    required: false
    default: "false"
  # model-compiler specifies the compiler to use for building the sail model on Linux (gcc or clang).
  # It will also install clang if needed.
  # It has no effect on macOS, which always uses Apple Clang.
  model-compiler:
    description: 'Compiler for the model on Linux ("gcc" or "clang"). macOS always uses Apple Clang.'
    required: false
    default: "clang"

# The 'default' Sail version below is the one specified in `cmake/sail_required_version.txt`.
# This is the current CI Platform/Target support matrix:
#
#                          | RISC-V Model                 |sail-riscv-tests|first-party-tests|   Rocq    |    Lean        | Linux boot
#--------------------------------------------------------------------------------------------------------------------------------------
# ubuntu-24.04 (x86_64):   | Sail:  default (binary)      |                |                 |           |                |
# (GCC model)              | CMake: 3.20.0                |       x        |                 |           |                |
#                          | Clang: -                     |                |                 |           |                |
#--------------------------------------------------------------------------------------------------------------------------------------
# ubuntu-24.04-arm:        | Sail:  default (binary)      |                |                 |           |                |
# (GCC model)              | CMake: 3.20.0                |       x        |                 |           |                |
#                          | Clang: -                     |                |                 |           |                |
#--------------------------------------------------------------------------------------------------------------------------------------
# ubuntu-26.04 (x86_64):   | Sail:  default (binary)      |                |                 |           |                |
# (Clang model)            | CMake: 4.1.2                 |       x        |       x         |           |                |
#                          | Clang: 22 (Ubuntu repos)     |                |                 |           |                |
#--------------------------------------------------------------------------------------------------------------------------------------
# ubuntu-26.04-arm:        | Sail:  default (binary)      |                |                 |           |                |
# (Clang model)            | CMake: 4.1.2                 |       x        |       x         |           |                |
#                          | Clang: 22 (Ubuntu repos)     |                |                 |           |                |
#--------------------------------------------------------------------------------------------------------------------------------------
# macos-latest:            | Sail:  default (opam)        |                |                 |           |                |
#                          | CMake: 4.1.2 + 3.20.0        |       x        |       x         |           |                |
#                          | Clang: brew versions         |                |                 |           |                |
#--------------------------------------------------------------------------------------------------------------------------------------
# ubuntu-26.04:            | Sail:  default (binary)      |                |                 |           | Sail: latest   |
#                          | CMake: (4.1.2)               |       x        |       x         |           | CMake: (4.1.2) |    x
#                          | Clang: 22 (Ubuntu repos)     |                |                 |           | Clang: -       |
#--------------------------------------------------------------------------------------------------------------------------------------
# ubuntu-26.04:            | Sail:  (default)             |                |                 |           |                |
#                          | CMake: (4.1.2)               |                |                 | rocq 9.1.1|                |
#                          | Clang: -                     |                |                 |           |                |
#--------------------------------------------------------------------------------------------------------------------------------------
# (Container builds)       |                              |                |                 |           |                |
# ------------------       |                              |                |                 |           |                |
#                          |                              |                |                 |           |                |
# rockylinux:8.10          | Sail:  default               |                |                 |           |                |
# runner: ubuntu-26.04     | CMake: 3.20.0                |       x        |       x         |           |                |
#                          | Clang: Rocky AppStream       |                |                 |           |                |
#--------------------------------------------------------------------------------------------------------------------------------------
# rockylinux:8.10          | Sail:  default               |                |                 |           |                |
# runner: ubuntu-26.04-arm | CMake: 3.20.0                |       x        |       x         |           |                |
#                          | Clang: Rocky AppStream       |                |                 |           |                |

runs:
  using: "composite"
  steps:
    - name: Install packages (Linux runner)
      if: runner.os == 'Linux' && job.container == null
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y --no-install-recommends pkg-config libgmp-dev curl ninja-build

    - name: Install packages (Linux container)
      if: runner.os == 'Linux' && job.container != null
      shell: bash
      # This is a Rocky container.
      run: |
        dnf install -y --enablerepo=devel libstdc++-static make gcc gcc-c++ pkg-config gmp-static ninja-build sudo

    # Clang 22 is used for both Ubuntu and Rocky Linux runners. Clang 22 is the only version available in the Rocky
    # dnf repository (though it fails to install if named clang-22 explicitly) and is also available on Ubuntu 26.04
    # via apt. It is new enough to compile all of our first-party RISC-V tests. If we add first-part tests that need
    # a newer compiler, we may need to update this version.
    - name: Install Clang (Linux runner)
      if: runner.os == 'Linux' && (inputs.install-clang == 'true' || inputs.model-compiler == 'clang')
      shell: bash
      run: |
        if [ -z "${{ job.container }}" ]; then
          CLANG_VERSION=22
          echo "CLANG_VERSION=$CLANG_VERSION" >> $GITHUB_ENV
          sudo apt install -y --no-install-recommends clang-$CLANG_VERSION lld-$CLANG_VERSION llvm-$CLANG_VERSION
        else
          sudo dnf install -y clang lld llvm
        fi

    - name: Use Clang for the model (Linux)
      if: runner.os == 'Linux' && inputs.model-compiler == 'clang'
      shell: bash
      # Use lld so that LTO does not need the gold plugin.
      run: |
        if [ -n "$CLANG_VERSION" ]; then
          SUFFIX="-$CLANG_VERSION"
        fi
        echo "CC=clang$SUFFIX" >> $GITHUB_ENV
        echo "CXX=clang++$SUFFIX" >> $GITHUB_ENV
        echo "LDFLAGS=-fuse-ld=lld" >> $GITHUB_ENV

    - name: Install packages (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install opam llvm lld
        echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

    - name: Install CMake
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Linux" ]; then
          cmake_suffix=$(arch)
        elif [ "${{ runner.os }}" = "macOS" ]; then
          cmake_suffix="universal"
        fi
        curl --location https://github.com/Kitware/CMake/releases/download/v${{ inputs.cmake-version }}/cmake-${{ inputs.cmake-version }}-${{ runner.os }}-$cmake_suffix.tar.gz | sudo tar xvz --directory=/usr/local --strip-components=1

    - name: Set Sail version
      shell: bash
      run: |
        if [ -z ${{ inputs.sail-version }} ]; then
          echo "SAIL_VERSION=$(cat cmake/sail_required_version.txt)" >> $GITHUB_ENV
        else
          echo "SAIL_VERSION=${{ inputs.sail-version }}" >>  $GITHUB_ENV
        fi

    - name: Restore cached opam (macOS or latest Sail)
      if: runner.os == 'macOS' || env.SAIL_VERSION == 'latest'
      id: cache-opam-restore
      uses: actions/cache/restore@v4
      with:
        path: ~/.opam
        key: ${{ runner.os }}-${{ runner.arch }}-cmake-${{ inputs.cmake-version }}-sail-${{ env.SAIL_VERSION }}-opam

    - name: Install Sail (Linux binary)
      if: runner.os == 'Linux' && env.SAIL_VERSION != 'latest'
      shell: bash
      run: |
        sudo mkdir -p /usr/local
        curl --location https://github.com/rems-project/sail/releases/download/${{ env.SAIL_VERSION }}-binary/sail-$(uname)-$(arch).tar.gz | sudo tar xvz --directory=/usr/local --strip-components=1

    - name: Install Sail (macOS opam)
      if: runner.os == 'macOS' && steps.cache-opam-restore.outputs.cache-hit != 'true' && env.SAIL_VERSION != 'latest'
      shell: bash
      run: |
        opam init --auto-setup --bare
        opam switch create default 5.3.0
        eval $(opam env)
        opam update
        opam install -y sail.${{ env.SAIL_VERSION }}

    - name: Install opam (latest Sail)
      if: env.SAIL_VERSION == 'latest'
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Linux" ]; then
          sudo apt install -y --no-install-recommends opam z3
        elif [ "${{ runner.os }}" = "macOS" ]; then
          brew install z3
        fi

    - name: Setup opam (latest Sail)
      if: env.SAIL_VERSION == 'latest' && steps.cache-opam-restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        opam init --yes --no-setup --shell=sh --compiler=5.3.0
        opam install dune

    - name: Install Sail (latest Sail)
      if: env.SAIL_VERSION == 'latest'
      shell: bash
      run: |
        git clone https://github.com/rems-project/sail.git
        eval $(opam env)
        (cd sail; opam install sail --deps-only --yes)
        (cd sail; make install)

    - name: Save cached opam (macOS or latest Sail)
      # Update cache only on the master branch
      if: (runner.os == 'macOS' || env.SAIL_VERSION == 'latest') && github.ref == 'refs/heads/master'
      id: cache-opam-save
      uses: actions/cache/save@v4
      with:
        path: ~/.opam
        key: ${{ steps.cache-opam-restore.outputs.cache-primary-key }}

    - name: Load OPAM environment (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: echo "$HOME/.opam/default/bin" >> $GITHUB_PATH
